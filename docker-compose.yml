services:
  postgres:
    image: postgres:16-alpine
    container_name: navex-postgres
    environment:
      POSTGRES_USER: navex
      POSTGRES_PASSWORD: navex_dev_pw
      POSTGRES_DB: navexwms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navex -d navexwms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: navex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: navex
      MINIO_ROOT_PASSWORD: navex_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
